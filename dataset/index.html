 .force('x',d3.forceX().strength(.035)).force('y',d3.forceY().strength(.045));

function draw(){
 const nodes=DATA.nodes.filter(n=>n.cs.some(c=>state.c.has(c)) && n.deg>=state.dmin);
 const ok=new Set(nodes.map(n=>n.id));
 let links=DATA.links.filter(l=>state.l.has(l.ty)&&ok.has(l.s)&&ok.has(l.t)&&(!state.x||l.x));
 const N=nodes.map(n=>Object.assign(byId[n.id]._p||{},n)), L=links.map(l=>({...l,source:l.s,target:l.t}));
 document.getElementById('stat').textContent=N.length+' вузлів · '+L.length+' ребер видно';
 lsel.selectAll('path').data(L,d=>d.s+d.ty+d.t).join('path')
   .attr('stroke',d=>LT[d.ty]).attr('stroke-width',d=>.5+d.w*1.5)
   .attr('stroke-opacity',d=>d.x?.75:.34)
   .attr('marker-end',d=>d.ty==='prerequisite'?'url(#ar)':null);
 const nn=nsel.selectAll('circle').data(N,d=>d.id).join('circle')
   .attr('r',d=>3.6+Math.sqrt(d.deg)*1.75)
   .attr('fill',d=>CC[d.cs[0]]).attr('stroke','#0e1116').attr('stroke-width',1)
   .style('opacity',d=>state.q&&!(d.n.toLowerCase().includes(state.q)||d.id.includes(state.q))?.13:1)
   .style('cursor','pointer')
   .on('mouseover',(e,d)=>{tip.style.opacity=1;tip.textContent=d.n+' ('+d.cs.join(',')+', d'+d.d+')'})
   .on('mousemove',e=>{tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY+10)+'px'})
   .on('mouseout',()=>tip.style.opacity=0)
   .on('click',(e,d)=>show(d.id))
   .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
     .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
 const tt=tsel.selectAll('text').data(N.filter(d=>d.deg>=6||state.q&&d.n.toLowerCase().includes(state.q)),d=>d.id)
   .join('text').text(d=>d.n).attr('font-size',10).attr('fill','#9fb0c4')
   .attr('text-anchor','middle').attr('dy',-9).style('pointer-events','none');
 sim.nodes(N).on('tick',()=>{
   lsel.selectAll('path').attr('d',d=>{const dx=d.target.x-d.source.x,dy=d.target.y-d.source.y,
     r=Math.hypot(dx,dy)*2.6;return `M${d.source.x},${d.source.y}A${r},${r} 0 0,1 ${d.target.x},${d.target.y}`});
   nn.attr('cx',d=>d.x).attr('cy',d=>d.y); tt.attr('x',d=>d.x).attr('y',d=>d.y);
 });
 sim.force('link').links(L); sim.alpha(.55).restart();
 N.forEach(n=>byId[n.id]._p=n);
}
svg.append('defs').html('<marker id="ar" viewBox="0 -4 8 8" refX="16" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,-3L7,0L0,3" fill="#e0645a" opacity=".8"/></marker>');

function show(id){
 const n=byId[id], out=DATA.links.filter(l=>l.s===id), inn=DATA.links.filter(l=>l.t===id);
 const os=DATA.occ[id]||[];
 const row=(l,dir)=>`<a class="nb" onclick="show('${dir==='out'?l.t:l.s}')">`+
   `<span class="sw" style="background:${LT[l.ty]};width:9px;height:9px;border-radius:2px"></span> `+
   (byId[dir==='out'?l.t:l.s]||{}).n+` <small>${l.ty}${l.x?' ⇄ cross-course':''}</small></a>`;
 document.getElementById('detail').innerHTML=
  `<h3>${n.n}</h3><div class="meta">${n.id} · ${n.k} · складність ${n.d}/5 · ${n.dom||''}</div>`+
  `<div>${n.cs.map(c=>`<span class="pill" style="background:${CC[c]}22;color:${CC[c]}">${c}</span>`).join('')}`+
  `${n.al.map(a=>`<span class="pill">${a}</span>`).join('')}</div>`+
  `<div class="def">${n.def}</div>`+
  `<h4>Юніти (${n.u.length})</h4><div>${n.u.map(u=>`<span class="pill">${u}</span>`).join('')}</div>`+
  `<h4>Файли-джерела (${n.f.length})</h4>${n.f.map(f=>`<div class="fp">${f}</div>`).join('')}`+
  (os.length?`<h4>Цитати-докази</h4>`+os.map(o=>`<div class="q">“${o.q}”<br><span style="color:#5b6675">— ${o.r}</span></div>`).join(''):'')+
  (out.length?`<h4>Веде до (${out.length})</h4>`+out.map(l=>row(l,'out')).join(''):'')+
  (inn.length?`<h4>Залежить від (${inn.length})</h4>`+inn.map(l=>row(l,'in')).join(''):'');
 document.getElementById('detail').scrollTop=0;
}
window.show=show; draw();
</script></html>
